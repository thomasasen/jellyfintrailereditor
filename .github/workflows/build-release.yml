name: Build and release Jellyfin Trailer Editor

on:
  push:
    branches: [main]
    paths-ignore: [manifest.json, README.md]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/trailer-editor.js
      - run: node --test tests/*.test.cjs

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '10.11'
            dotnet: '9.0.x'
            version: '0.1.4.0'
            abi: '10.11.0.0'
            suffix: '10.11'
          - target: '12'
            dotnet: '10.0.x'
            version: '0.1.4.12'
            abi: '12.0.0.0'
            suffix: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Build
        run: dotnet publish src/Jellyfin.Plugin.TrailerEditor.csproj -c Release -p:TargetJellyfin=${{ matrix.target }} -p:Version=${{ matrix.version }} -o dist/publish
      - name: Package plugin DLL and icon
        run: |
          set -euo pipefail
          mkdir -p dist/packages
          cp assets/trailer-editor.png dist/publish/trailer-editor.png
          cat > dist/publish/meta.json <<'EOF'
          {
            "guid": "56e9d5a8-b42c-4eb7-9e8e-d09bd15a4f08",
            "name": "Trailer Editor",
            "version": "${{ matrix.version }}",
            "targetAbi": "${{ matrix.abi }}",
            "imagePath": "trailer-editor.png",
            "assemblies": ["Jellyfin.Plugin.TrailerEditor.dll"],
            "autoUpdate": true
          }
          EOF
          cd dist/publish
          zip -9 ../packages/JellyfinTrailerEditor_${{ matrix.suffix }}.zip Jellyfin.Plugin.TrailerEditor.dll trailer-editor.png meta.json
      - name: Verify icon and package metadata
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          filename = Path("dist/packages/JellyfinTrailerEditor_${{ matrix.suffix }}.zip")
          with zipfile.ZipFile(filename) as package:
              assert set(package.namelist()) == {"Jellyfin.Plugin.TrailerEditor.dll", "trailer-editor.png", "meta.json"}
              metadata = json.loads(package.read("meta.json"))
              assert metadata["imagePath"] == "trailer-editor.png"
              assert metadata["version"] == "${{ matrix.version }}"
              assert metadata["targetAbi"] == "${{ matrix.abi }}"
              logo = package.read("trailer-editor.png")
              assert logo.startswith(bytes.fromhex("89504e470d0a1a0a"))
          print(f"Verified {filename}: icon, imagePath and version are valid")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.suffix }}
          path: dist/packages/*.zip
          if-no-files-found: error

  release:
    needs: [build, javascript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          path: dist/releases
          pattern: package-*
          merge-multiple: true
      - name: Create release if missing, then publish checksummed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=v0.1.4
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" dist/releases/*.zip --title "Trailer Editor 0.1.4" --notes "Jellyfin 10.11 and 12 builds. See README for installation and limitations." --target "$GITHUB_SHA"
          else
            gh release upload "$VERSION" dist/releases/*.zip --clobber
          fi
          python3 scripts/update_manifest.py dist/releases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish checksummed plugin catalog [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
