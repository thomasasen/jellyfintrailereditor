name: Build and release Jellyfin Trailer Editor

on:
  push:
    branches: [main]
    paths-ignore: [manifest.json, README.md]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/trailer-editor.js
      - run: node --test tests/trailer-editor.test.cjs

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '10.11'
            dotnet: '9.0.x'
            version: '0.1.0.0'
            abi: '10.11.0.0'
            suffix: '10.11'
          - target: '12'
            dotnet: '10.0.x'
            version: '0.1.0.12'
            abi: '12.0.0.0'
            suffix: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Build
        run: dotnet publish src/Jellyfin.Plugin.TrailerEditor.csproj -c Release -p:TargetJellyfin=${{ matrix.target }} -p:Version=${{ matrix.version }} -o dist/publish
      - name: Package plugin DLL
        run: |
          mkdir -p dist/packages
          cd dist/publish
          zip -9 ../packages/JellyfinTrailerEditor_${{ matrix.suffix }}.zip Jellyfin.Plugin.TrailerEditor.dll
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.suffix }}
          path: dist/packages/*.zip
          if-no-files-found: error

  release:
    needs: [build, javascript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          path: dist/releases
          pattern: package-*
          merge-multiple: true
      - name: Create release if missing, then publish checksummed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=v0.1.0
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" dist/releases/*.zip --title "Trailer Editor 0.1.0" --notes "Jellyfin 10.11 and 12 builds. See README for installation and limitations." --target "$GITHUB_SHA"
          else
            gh release upload "$VERSION" dist/releases/*.zip --clobber
          fi
          python3 scripts/update_manifest.py dist/releases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish checksummed plugin catalog [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
